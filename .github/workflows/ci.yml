name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The integration tests start a real PostgreSQL container (Testcontainers); Docker is preinstalled on the runner.
      - name: Build and test
        run: dotnet test OrderApi.slnx --configuration Release

  frontend:
    name: Angular tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm test -- --no-watch
      - run: npm run build

  docker:
    name: Docker images build
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
