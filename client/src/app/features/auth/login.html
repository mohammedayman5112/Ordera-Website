<section class="card auth-card">
  <app-brand-logo class="brand" [size]="32" />

  <h1>Sign in</h1>
  <p class="lead">Welcome back. Enter your details to continue.</p>

  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (error(); as message) {
      <div class="alert alert-error" role="alert">{{ message }}</div>
    }

    <div class="field">
      <label for="login-email">Email</label>
      <input
        id="login-email"
        class="input"
        type="email"
        formControlName="email"
        autocomplete="username"
        [class.invalid]="showError('email')"
      />
      @if (showError('email')) {
        <span class="error">Enter a valid email address.</span>
      }
    </div>

    <div class="field">
      <label for="login-password">Password</label>
      <input
        id="login-password"
        class="input"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [class.invalid]="showError('password')"
      />
      @if (showError('password')) {
        <span class="error">Enter your password.</span>
      }
    </div>

    <button type="submit" class="btn btn-primary submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="switch">New here? <a routerLink="/register">Create an account</a></p>
</section>
